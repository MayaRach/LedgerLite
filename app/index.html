<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LedgerLite</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div><p class="eyebrow">School club treasury</p><h1>LedgerLite</h1></div>
      <span class="badge">Reliability first</span>
    </header>
    <section class="panel">
      <h2>Accounts</h2>
      <div id="accounts" class="cards"></div>
    </section>
    <section class="grid">
      <form id="tx-form" class="panel">
        <h2>Record transaction</h2>
        <label>Account<select id="account" required></select></label>
        <label>Type<select id="kind"><option value="deposit">Deposit</option><option value="expense">Expense</option></select></label>
        <label>Amount ($)<input id="amount" type="number" min="0.01" step="0.01" required /></label>
        <label>Description<input id="description" maxlength="200" required /></label>
        <label>Actor<input id="actor" value="Maya" required /></label>
        <button type="submit">Submit safely</button>
        <p id="message" class="message"></p>
      </form>
      <section class="panel">
        <h2>Recent activity</h2>
        <div id="transactions" class="transactions"></div>
      </section>
    </section>
  </main>
<script>
const money = cents => new Intl.NumberFormat('en-US', {style:'currency', currency:'USD'}).format(cents/100);
async function refresh() {
  const [accounts, txs] = await Promise.all([
    fetch('/api/accounts').then(r => r.json()),
    fetch('/api/transactions').then(r => r.json())
  ]);
  document.querySelector('#accounts').innerHTML = accounts.map(a =>
    '<article class="account-card"><span>' + a.name + '</span><strong>' + money(a.balance_cents) + '</strong></article>'
  ).join('');
  document.querySelector('#account').innerHTML = accounts.map(a =>
    '<option value="' + a.id + '">' + a.name + '</option>'
  ).join('');
  document.querySelector('#transactions').innerHTML = txs.length ? txs.map(t =>
    '<div class="tx"><div><strong>' + t.description + '</strong><span>' + t.account_name + ' · ' + t.actor +
    '</span></div><b class="' + t.kind + '">' + (t.kind === 'expense' ? '-' : '+') + money(t.amount_cents) + '</b></div>'
  ).join('') : '<p class="muted">No transactions yet.</p>';
}
document.querySelector('#tx-form').addEventListener('submit', async e => {
  e.preventDefault();
  const body = {
    account_id: Number(document.querySelector('#account').value),
    amount_cents: Math.round(Number(document.querySelector('#amount').value) * 100),
    kind: document.querySelector('#kind').value,
    description: document.querySelector('#description').value,
    actor: document.querySelector('#actor').value
  };
  const res = await fetch('/api/transactions', {
    method: 'POST',
    headers: {'Content-Type':'application/json','Idempotency-Key':crypto.randomUUID(),'X-Role':'treasurer'},
    body: JSON.stringify(body)
  });
  const data = await res.json();
  const msg = document.querySelector('#message');
  msg.textContent = res.ok ? 'Transaction recorded.' : (data.detail || 'Request failed.');
  msg.className = 'message ' + (res.ok ? 'ok' : 'error');
  if (res.ok) { e.target.reset(); document.querySelector('#actor').value='Maya'; await refresh(); }
});
refresh();
</script>
</body>
</html>
